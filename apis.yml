name: EIS Group
kind: company
description: EIS Group (EIS Ltd) is a United States core-systems vendor for insurance,
  founded in 2008 out of Exigen Insurance Solutions and headquartered in San Francisco,
  California. EIS sells the EIS Platform and EIS OneSuite — a cloud-native, microservices
  core suite covering customer management, policy administration, billing, and claims
  — across group benefits, property and casualty / general, protection, life and annuities,
  and pet insurance. EIS markets itself as API-first and claims thousands of open REST
  APIs (1,100 digital APIs announced in 2019, 9,000+ claimed for OneSuite) fronted by
  the EIS DXP API middleware, but none of that surface is public. There is no self-serve
  developer portal on eisgroup.com; the documentation host docs.eisgroup.com answers
  HTTP 401 behind an HTTP Basic realm named "EIS Group Users", so the entire API
  reference is a customer/partner login wall. No OpenAPI, Swagger, GraphQL, AsyncAPI,
  or public Postman collection could be retrieved. The only public code EIS ships is
  two open-source GitHub repositories (kraken-rules, ui-render), which are libraries
  rather than APIs. ACORD is attested only indirectly — an analyst evaluation hosted on
  eisgroup.com states the system integrates using "web services, APIs, RESTful APIs,
  ACORD and certified ACORD" — with no ACORD artifacts, AL3 mappings, or IVANS/agency-download
  detail published. What EIS does publish is a substantial certification posture — a certified
  MACH Alliance membership (Microservices, API-first, Cloud-native SaaS, Headless) and a full
  ISO stack covering 27001, 27701, 22301, 27017, 27018, 27035-1, 12207, 15288, 25000 and
  ISO/IEC 42001, which EIS announced in June 2025 as the first cloud-native insurance
  core platform provider to obtain. One first-party package is public, eis-ui-render on npm.
  This is the canonical United States core-systems posture — the APIs
  exist and are sold, but they are reachable only through a licensed implementation.
