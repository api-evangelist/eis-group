summary: |
  EIS Group publishes a substantial certification posture on its company page
  ("EIS Certifications & Recognitions") — a full ISO management-system stack including
  ISO/IEC 27001:2022, 27701, 27017, 27018, 27035-1, 22301, the software-lifecycle set
  (12207 / 15288 / 25000), and ISO/IEC 42001:2023, which EIS announced in June 2025 as
  the first cloud-native insurance core platform provider to obtain. EIS is also a
  certified MACH Alliance member (Microservices, API-first, Cloud-native SaaS, Headless),
  the strongest third-party attestation of its API-first architecture claim.
  API-level conformance, by contrast, is unverifiable: no OpenAPI, AsyncAPI, GraphQL SDL
  or .proto is public, no OAuth/OIDC discovery document is served, and ACORD support is
  attested only second-hand in an analyst evaluation hosted on eisgroup.com. Every
  "conforms: null" row below is unobservable rather than failing — the contract is behind
  the docs.eisgroup.com HTTP Basic wall.
