summary: |
  EIS Group ships one public client-side component library: ui-render (published to npm as
  eis-ui-render), an open-source recursive React renderer that builds UI from JSON
  configuration/schemas. It is the presentation layer used with the EIS Platform portals,
  not a hosted or embeddable widget for a public API — EIS publishes no hosted checkout,
  embedded dashboard, or drop-in web-component surface, because no public API exists to
  back one.
