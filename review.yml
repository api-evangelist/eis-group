actions:
  openapiHarvested: false
  openapiDirectoryCreated: false
  apisYmlApisEmpty: true
  reason: |
    No public, self-serve API surface exists for EIS Group. Every documented API is behind
    the docs.eisgroup.com HTTP Basic wall or inside a licensed implementation. Per the
    insurance-sector bootstrap rules, apis[] is left empty and the record stands as an
    honest stub rather than inventing an API family from marketing copy.
