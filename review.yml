aid: eis-group
name: EIS Group
review:
  question: Does EIS Group expose a public, self-serve developer portal and downloadable
    API specifications for its insurance core platform?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  sector: Insurance
  tier: core-systems
  openapiHarvested: false
  specsCount: 0
  gated: true
findings:
  summary: |
    EIS Group (EIS Ltd) is a San Francisco, California core-systems vendor selling the
    EIS Platform / EIS OneSuite policy, billing, claims, and customer suite to insurers
    in group benefits, P&C / general, protection, life and annuities, and pet insurance.
    EIS markets itself aggressively as API-first — a 2019 press release announced "over
    1,100 REST APIs" in the EIS DXP digital experience platform, and current OneSuite
    marketing claims "9,000+ APIs" — but none of that surface is publicly reachable.

    There is no self-serve developer portal. developer.eisgroup.com, developers.eisgroup.com,
    api.eisgroup.com, apidocs.eisgroup.com, portal.eisgroup.com, support.eisgroup.com,
    community.eisgroup.com, developerportal.eisgroup.com and sandbox.eisgroup.com all fail
    to resolve or connect (curl 000). eisgroup.com/developers and eisgroup.com/developer
    both return HTTP 404. The one documentation host that exists, docs.eisgroup.com,
    returns HTTP 401 with `WWW-Authenticate: Basic realm="EIS Group Users"` on every path
    probed (/, /index.html, /api, /rest-api, /openapi.json, /swagger.json,
    /.well-known/openid-configuration) — a blanket HTTP Basic wall in front of the entire
    documentation tree, resolving through prod-proxy.eisgroup.com. That is a customer /
    partner login wall, not a developer portal.

    Zero OpenAPI, Swagger, GraphQL SDL, AsyncAPI, or .proto artifacts could be harvested.
    Nothing on www.eisgroup.com serves a spec (/openapi.json, /swagger.json, /api-docs all
    404). The public page-sitemap contains no developer, API-reference, or spec pages —
    only marketing, use-case, partner, and resource pages. university.eisgroup.com resolves
    (redirects to /learn, HTTP 200) but renders only a JavaScript loading shell with no
    public content and no API reference.

    EIS does publish two open-source GitHub repositories under github.com/eisgroup —
    kraken-rules (Java business rules engine) and ui-render (React dynamic UI rendering).
    A second organization, github.com/eis-group-opensource, holds 75 repositories, but
    these are forks of third-party Java/Scala libraries (Spring, RxJava, Guava, Hibernate,
    Liquibase, swagger-codegen) used in EIS builds, not EIS APIs. Neither org publishes an
    API definition.

    A Postman team profile exists at postman.com/eis-group-8390 (HTTP 200, created
    2024-10-04) but the Postman public search index reports collectionCount 0,
    workspaceCount 0, and apiCount 0 — an empty team profile with no published collections.

    ACORD posture is attested only second-hand. The Aite Matrix "2020 US P&C Core Systems
    Evaluation" PDF hosted on eisgroup.com states verbatim: "The system uses web services,
    APIs, RESTful APIs, ACORD and certified ACORD to integrate ETPD. It can also use JMS,
    AMQP, and Kafka." Site search for ACORD on eisgroup.com otherwise returns only a 2016
    ACORD conference sponsorship press release. No ACORD XML schemas, AL3 mappings, NGDS
    references, IVANS / agency-download detail, or Applied Epic / Vertafore AMS360
    connector documentation is published anywhere public.

    Quote / bind / issue / FNOL: EIS markets all four capabilities (rating and quoting,
    policy issuance, and an FNOL use-case page at eisgroup.com/digital-insurance-solutions
    covering claims automation, claims leakage, and FNOL), but none is exposed as a public
    API. Every one of these verbs is reachable only inside a licensed EIS implementation.

    Auth model: unknown / undocumented publicly. The only observable authentication on any
    EIS host is HTTP Basic on docs.eisgroup.com. No /.well-known/openid-configuration or
    /.well-known/oauth-authorization-server is served on www.eisgroup.com (both 404) or
    anonymously on docs.eisgroup.com (401).

    Webhooks / events: no public event catalog and no AsyncAPI. EIS marketing describes the
    platform as "event-driven" and the Aite evaluation names JMS, AMQP, and Kafka as
    integration transports, but no event schema, topic list, or subscription documentation
    is public.

    Verdict: honest stub. EIS Group is a real, substantial API producer whose entire API
    estate is sold rather than published. The correct record for the United States
    core-systems tier is partner-gated with zero harvestable artifacts.
