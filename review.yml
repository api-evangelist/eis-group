  postman:
    publicCollections: false
    teamProfile: https://www.postman.com/eis-group-8390
    note: Team profile exists (HTTP 200) but Postman public search reports 0 collections,
      0 workspaces, 0 APIs.
  graphql:
    documented: false
    note: https://www.eisgroup.com/graphql returns HTTP 404. No GraphQL surface found.
  grpc:
    documented: false
    note: No published .proto files in either EIS GitHub organization.
  openSource:
