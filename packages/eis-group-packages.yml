summary: |
  EIS Group publishes no API client SDK. Its entire REST surface (1,100+ DXP APIs
  announced 2019, 9,000+ claimed for OneSuite) sits behind the docs.eisgroup.com HTTP
  Basic wall, so there is nothing public for a client library to target. The only
  first-party package published to a public registry is eis-ui-render, the npm build of
  the open-source github.com/eisgroup/ui-render JSON-schema-driven React renderer. The
  second open-source project, kraken-rules, is Apache-2.0 source on GitHub but its Java
  modules use the non-Central groupId "kraken" and its JavaScript packages declare
  publishConfig.registry = https://genesis-npm-release.exigengroup.com/ (an EIS-internal
  Nexus), so no kraken artifact resolves from Maven Central or npmjs.org.
